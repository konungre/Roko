[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-metta-pm"
version = "0.2.0"
description = "A declarative MeTTa-data package-management prototype for Omega"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
omega-pm = "omega_pm.__main__:main"

[tool.setuptools.packages.find]
include = ["omega_pm*"]
